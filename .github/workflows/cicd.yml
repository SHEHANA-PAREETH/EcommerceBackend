name: "Deploy Node Application"
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker Image
        run: docker build -t shehanapareeth/ecommerce-node-backend .
      - name: Publish Image to docker hub
        run: docker push shehanapareeth/ecommerce-node-backend:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull Image from Docker  hub
        run: docker pull shehanapareeth/ecommerce-node-backend:latest
      - name: Remove existing container
        run: docker rm -f nodejs-app-container
      - name: Run Docker Container
        run: >
          docker run -d -p 5000:5000 --name nodejs-app-container
          -e MONGO_URI='${{ secrets.MONGO_URI }}'
          -e JWT_SECRETKEY='${{ secrets.JWT_SECRETKEY }}'
          -e STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}'
          -e CLIENT_SITE_URL='${{ secrets.CLIENT_SITE_URL }}'
          -e CLOUDINARY_URL='${{ secrets.CLOUDINARY_URL }}'
          shehanapareeth/ecommerce-node-backend
